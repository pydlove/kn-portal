spring.application.name=one-table
server.port=8080
server.servlet.context-path=/one-table-service
system.jwt.issuer=https://www.aiocloud.com
system.jwt.audience=https://www.aiocloud.com
system.url.whitelist=/test/**
# Mysql
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.url=jdbc:mysql://localhost:3306/one-table?rewritBatchedStatements=true&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
